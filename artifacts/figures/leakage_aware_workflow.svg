   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #3b6fb6" x="37.89" y="39.694512" transform="rotate(-0 37.89 39.694512)">1  Define the prediction task</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(37.89 50.686351)">Set the delivery endpoint,</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(37.89 58.065118)">held-screen setting, and</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(37.89 65.484714)">candidate-ranking decision.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #3b6fb6" x="241.9785" y="39.694512" transform="rotate(-0 241.9785 39.694512)">2  Assemble formulation inputs</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(241.9785 50.684781)">Map lipid roles, ratios, process,</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(241.9785 58.065118)">target context, and endpoint</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(241.9785 65.470058)">support.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #7a5195" x="446.067" y="39.694512" transform="rotate(-0 446.067 39.694512)">3  Control shortcut signals</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(446.067 50.688445)">Quantify source-linked</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(446.067 58.065118)">missingness and exclude explicit</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(446.067 65.5648)">provenance identifiers.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #7a5195" x="446.067" y="142.896072" transform="rotate(-0 446.067 142.896072)">4  Split experimental groups</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(446.067 153.887911)">Assign complete groups first;</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(446.067 161.307507)">fit preprocessing and select models</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(446.067 168.727102)">on training/validation groups.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #b55a30" x="241.9785" y="142.896072" transform="rotate(-0 241.9785 142.896072)">5  Train point and rank heads</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(241.9785 153.929262)">Optimize masked endpoints and</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(241.9785 161.266678)">within-screen ranking as separate</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(241.9785 168.725532)">but coordinated outputs.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2b8c6f" x="37.89" y="142.896072" transform="rotate(-0 37.89 142.896072)">6  Evaluate reliability</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(37.89 153.886341)">Use screen bootstrap, size, and</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(37.89 161.307507)">risk--coverage analyses to define</text>
    <text style="font-size: 6.7px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #263238" transform="translate(37.89 168.686274)">the deployment scope.</text>
   </g>
  </g>
 </g>
