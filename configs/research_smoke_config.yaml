training:
  num_epochs: 2
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  lr_min: 0.00001
  warmup_epochs: 1
  early_stopping:
    enabled: true
    patience: 3
    min_delta: 0.0001
  gradient_clip: 1.0
  use_amp: true
  gradient_accumulation_steps: 1
  ranking_weight: 2.0
  ranking_margin: 0.1
  target_aux_weight: 0.2
  evaluate_test_each_epoch: false

model:
  mol_encoder_type: "graph"
  mol_feat_dim: 64
  atom_feat_dim: 39
  bond_feat_dim: 4
  num_gnn_layers: 2
  transformer_layers: 2
  transformer_embed_dim: 64
  transformer_heads: 4
  use_3d: false
  struct_feat_dim: 64
  use_images: false
  image_feat_dim: 64
  image_channels: 3
  image_size: 64
  use_embeddings: false
  embedding_feat_dim: 64
  max_embedding_dim: 2048
  formul_feat_dim: 64
  num_components: 4
  formulation_input_dim: 28
  context_feat_dim: 26
  target_feat_dim: 11
  num_target_classes: 11
  spatial_feat_dim: 12
  use_component_transformer: true
  use_pair_bias: false
  use_target_conditioning: true
  use_spatial_features: true
  use_ratio_features: true
  # Ablation-selected A3: linear ratio encoding; RBF/noise degraded validation.
  use_gaussian_ratio: false
  formulation_noise_std: 0.0
  use_explicit_features: false
  use_structure_mask_features: false
  explicit_fusion_mode: "residual"
  explicit_gate_init: -3.0
  use_separate_rank_head: true
  rank_head_mode: "residual"
  rank_detach_backbone: true
  rank_gate_init: -1.0
  physchem_feat_dim: 64
  fusion_hidden_dim: 64
  fusion_num_heads: 4
  fusion_dropout: 0.1
  num_experts: 3
  prediction_hidden_dim: 64
  num_tasks: 6
  use_mc_dropout: false
  mc_dropout_rate: 0.1

dataset:
  merged_datasets_dir: "merged_datasets"
  modalities: ["formulation"]
  sample_fraction: 0.01
  random_seed: 42
  num_workers: 0
  max_atoms: 256
  fingerprint_dim: 2048
  image_size: 64
  split_strategy: "group"
  use_spatial: false
  include_source_context: false
  use_mechanistic_descriptors: false
  target_encoding: "onehot"
  balanced_sampling: true
  ensure_rare_task_holdout: true

checkpoint:
  save_dir: "checkpoints/space_smoke"
  save_every: 1
  keep_last_n: 2
  save_best: true

logging:
  use_wandb: false
  use_tensorboard: false
  log_dir: "logs/space_smoke"
  print_frequency: 5

evaluation:
  result_dir: "evaluation_results/space_smoke"
