- id: R09
  directory: decision_audit_postfix_20260902_003940
  date: 2026-09-02 11:14
  stage: 缺失靶点标签修复后的权威复核
  objective: 统一五折主模型、神经树集成、三分区核心消融、matched efficacy-only 与适用域结论。
  protocol: 13605 rows; 5 endpoint-balanced held-screen folds plus 3 frozen group-shuffle partitions; validation-only selection;
    CUDA 2.11.0+cu128.
  baseline: A79_validation_pareto_checkpoint
  verdict: DeepLNP 与 Extra Trees 的平均 RMSE 基本相当；validation-selected hybrid 的平均 RMSE 最低；Extra Trees 是更强的 standalone ranker。ListMLE
    未带来稳定验证增益，靶点条件贡献小且跨分区波动。
  status: confirmed
  decisions:
    A79_validation_pareto_checkpoint: 保留为独立神经主模型；test RMSE 1.0112±0.0054，screen rho 0.1074±0.0977。
    validation_selected_neural_tree_hybrid: 保留为 point predictor；test RMSE 0.9877±0.0198；相对 Extra Trees 的 screen-bootstrap
      区间跨零。
    Role-aware_Extra_Trees: 保留为 standalone screening baseline；screen rho 0.2435±0.0742。
    A66_listmle_screen_objective: 不提升；validation screen rho -0.1207，normalized regret 0.4109。
    A77_centered_plus_light_listmle: 与 centred reference 实质持平，不纳入主目标。
